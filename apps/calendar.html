<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ProjectOS Calendar</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: transparent;
    }

    table {
      width: 100%;
      height: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      text-align: center;
      /* Dynamic viewport-based font sizing */
      font-size: min(4vw, 6vh);
    }

    th, td {
      padding: 0;
      margin: 0;
      line-height: 1;
    }

    th {
      font-weight: bold;
      /* Header text scales slightly smaller to maintain grid balance */
      font-size: min(3.5vw, 5vh);
    }

    td.today {
      outline: 2px solid blue;
      background-color: blue;
      color: white;
    }
  </style>
</head>
<body>

  <table id="calendarTable">
    <thead>
      <tr id="headerRow"></tr>
    </thead>
    <tbody id="calendarBody"></tbody>
  </table>

  <script>
    const calendarTable = document.getElementById('calendarTable');
    const headerRow = document.getElementById('headerRow');
    const calendarBody = document.getElementById('calendarBody');

    // Dynamic Font Resizer for finer JS control if needed
    function adjustFontSize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      // Fits font based on whichever dimension is smaller
      const calculatedSize = Math.min(w / 12, h / 10);
      calendarTable.style.fontSize = `${calculatedSize}px`;
    }

    window.addEventListener('resize', adjustFontSize);

    // Auto-detect browser/system locale for day abbreviations
    const userLocale = navigator.language || 'default';
    const dayFormatter = new Intl.DateTimeFormat(userLocale, { weekday: 'short' });

    for (let i = 0; i < 7; i++) {
      const tempDate = new Date(1970, 0, 4 + i); // Jan 4, 1970 was a Sunday
      const th = document.createElement('th');
      th.textContent = dayFormatter.format(tempDate);
      headerRow.appendChild(th);
    }

    const today = new Date();
    const currentYear = today.getFullYear();
    const currentMonth = today.getMonth();
    const currentDate = today.getDate();

    const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

    let dayCounter = 1;

    for (let row = 0; row < 6; row++) {
      const tr = document.createElement('tr');
      let rowHasDates = false;

      for (let col = 0; col < 7; col++) {
        const td = document.createElement('td');

        if ((row === 0 && col < firstDayIndex) || dayCounter > daysInMonth) {
          td.textContent = '';
        } else {
          rowHasDates = true;
          td.textContent = dayCounter;

          if (dayCounter === currentDate) {
            td.className = 'today';
          }

          dayCounter++;
        }

        tr.appendChild(td);
      }

      if (rowHasDates) {
        calendarBody.appendChild(tr);
      }
    }

    adjustFontSize();
  </script>

</body>
</html>
